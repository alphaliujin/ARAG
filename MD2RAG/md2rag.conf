[md2rag]
md_dir = ../MD
vector_db_dir = ../vector_db
collection_prefix = md2rag
default_chunk_strategy = auto
skip_existing = false

[embedding]
model = ollama-bge-m3
batch_size = 32

[ollama]
enabled = true
base_url = http://localhost:11434
model = bge-m3:latest

[device]
type = cpu

[vit]
enabled = false

[sentence_transformers]
enabled = false