[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md2rag"
version = "0.2.0"
description = "将 X2MD 生成的 Markdown 切片向量化并存入向量数据库"
requires-python = ">=3.9"
dependencies = [
    "chromadb>=0.4.0",
    "click>=8.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
ollama = []
st = ["sentence-transformers>=2.2.0"]
dev = ["pytest>=7.0.0", "ruff>=0.4.0"]

[project.scripts]
md2rag = "md2rag.cli:cli"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
