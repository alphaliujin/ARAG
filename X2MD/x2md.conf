[x2md]
input_dir = ../DOC
output_dir = ../MD
encoding = utf-8

[llm]
enabled = true
model = qwen3:14b
base_url = http://localhost:11434
timeout = 120
call_interval = 0.5
max_concurrent = 10

[pdf]
extract_tables = true
page_separator = \n\n---\n\n

[docx]
heading_style = true

[xlsx]
include_all_sheets = true
default_sheet =

[pptx]
slide_separator = \n\n---\n\n

[image]
ocr_enabled = true
ocr_lang = chi_sim+eng
ocr_engine = paddleocr
ocr_paddle_model = PP-OCRv6_medium

[vit]
enabled = false
model = openai/clip-vit-large-patch14
device = mps
local_files_only = true
mirror =
labels =

[html]
encoding = utf-8

[chunk]
chunk_size = 500
chunk_overlap = 100
separators = \n\n,\n,。,！,？,；,., ,
separator_rule = after,after,after,after,after,after,after,after,after
max_chunk_limit = 10000
inject_abstract = true
