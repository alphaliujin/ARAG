[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x2md"
version = "0.2.0"
description = "Convert various file formats to Markdown for RAG chunking and ingestion"
requires-python = ">=3.9"
license = "MIT"
keywords = ["markdown", "converter", "rag", "pdf", "docx", "xlsx", "pptx", "ocr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "click>=8.0",
    "pdfplumber>=0.10",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "beautifulsoup4>=4.12",
    "Pillow>=10.0",
    "pydantic>=2.0",  # chunk.py 使用 Pydantic dataclass/models
    "xlrd>=2.0",  # 老版本 Excel .xls 支持
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3"]
vit = ["transformers>=4.30", "torch>=2.0"]
legacy = ["xlrd>=2.0"]  # 老版本 Office 支持
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
x2md = "x2md.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/x2md"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
